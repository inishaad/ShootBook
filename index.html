<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12161C"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ShootBook"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><title>ShootBook</title>
<style>
:root{--bg:#EEF1F4;--card:#fff;--ink:#12161C;--mut:#68717D;--line:#DDE2E8;--red:#D6372F;--green:#17803D;--slate:#12161C;--onslate:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1115;--card:#181C22;--ink:#EEF1F4;--mut:#98A1AD;--line:#272D35;--red:#FF6B61;--green:#4CD27F;--slate:#000;--onslate:#fff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1115;--card:#181C22;--ink:#EEF1F4;--mut:#98A1AD;--line:#272D35;--red:#FF6B61;--green:#4CD27F;--slate:#000;--onslate:#fff;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Avenir Next",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
#app{max-width:520px;margin:0 auto;padding:16px 16px 110px}
h1{font-size:22px;margin:4px 0 14px;letter-spacing:-.01em}
.slate{background:var(--slate);color:var(--onslate);border-radius:14px;overflow:hidden;margin-bottom:18px;border:1px solid var(--line)}
.stripes{height:16px;background:repeating-linear-gradient(-45deg,#fff 0 14px,#000 14px 28px)}
.slate .in{padding:16px 18px 18px}
.slate small{opacity:.7;font-size:13px}
.big{font-size:38px;font-weight:700;letter-spacing:-.02em;margin:2px 0 10px}
.row2{display:flex;gap:20px;font-size:14px}.row2 b{display:block;font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer}
.card .t{font-weight:600}.card .s{color:var(--mut);font-size:13px}
.amt{font-weight:700;text-align:right;white-space:nowrap}.amt small{display:block;font-weight:400;color:var(--mut);font-size:12px}
.red{color:var(--red)}.green{color:var(--green)}
.empty{color:var(--mut);text-align:center;padding:36px 10px}
.btn{border:0;border-radius:12px;padding:14px;font-weight:600;font-size:16px;font-family:inherit;color:#fff;cursor:pointer;width:100%}
.b-red{background:#C62F28}.b-green{background:#17803D}.b-ink{background:var(--ink);color:var(--bg)}.b-ghost{background:transparent;color:var(--mut);border:1px solid var(--line)}.b-del{background:transparent;color:var(--red);border:1px solid var(--red)}
.fab{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%);display:flex;gap:10px;max-width:520px;margin:0 auto}
.back{background:none;border:0;color:var(--mut);font:inherit;padding:6px 0;cursor:pointer}
.day{color:var(--mut);font-size:13px;margin:16px 2px 6px}
#sheet{position:fixed;inset:0;display:none;z-index:9}#sheet.on{display:block}
.bg{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.box{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:var(--card);border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}}
@media (prefers-reduced-motion:reduce){.box{animation:none}}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 5px}
input,textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:12px;font:inherit}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.amtin{font-size:30px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:20px;padding:7px 13px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.gap{height:14px}.two{display:flex;gap:10px}
textarea.claim{height:230px;font-size:14px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}.th{width:64px;height:64px;border-radius:8px;border:1px solid var(--line);background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--mut);cursor:pointer;position:relative;overflow:hidden}.th img{width:100%;height:100%;object-fit:cover}.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}.kp button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:12px 0;font-weight:600;font-size:18px;font-family:inherit;cursor:pointer}.kp .op{background:var(--ink);color:var(--bg)}.kp .w2{grid-column:span 2}#ap{color:var(--mut);font-size:14px;min-height:20px;margin-top:4px}.th b{position:absolute;top:0;right:0;background:rgba(0,0,0,.65);color:#fff;width:22px;height:22px;text-align:center;line-height:22px;border-radius:0 0 0 8px;font-size:15px}
</style><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script></head>
<body><div id="app"></div><div id="sheet"></div>
<script>
const K='shootbook-v1',CATS=['Food','Travel','Room','Fuel','Other'];
let pend=[],DB=null;
const idb=()=>DB||(DB=new Promise((ok,no)=>{try{const r=indexedDB.open('shootbook',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}catch(e){no(e)}}));
const fput=async(k,v)=>{const d=await idb();return new Promise((ok,no)=>{const t=d.transaction('f','readwrite');t.objectStore('f').put(v,k);t.oncomplete=ok;t.onerror=()=>no(t.error)})};
const fget=async k=>{const d=await idb();return new Promise((ok,no)=>{const r=d.transaction('f').objectStore('f').get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})};
const fdel=async k=>{try{const d=await idb();d.transaction('f','readwrite').objectStore('f').delete(k)}catch(e){}};
const rd=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)});
const blobOf=u=>{const[h,b]=u.split(','),m=h.match(/:(.*?);/)[1],s=atob(b),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return new Blob([a],{type:m})};
async function prep(f){
  const img=f.type.startsWith('image/');let data=await rd(f);
  if(img)data=await new Promise(ok=>{const i=new Image();i.onload=()=>{const k=Math.min(1,1400/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.7))};i.onerror=()=>ok(data);i.src=data});
  return{id:uid(),name:f.name||'bill',type:img?'image':f.type==='application/pdf'?'pdf':'file',data};
}
async function readAll(inp){const out=[];for(const f of [...inp.files]){if(f.size>15e6)continue;try{out.push(await prep(f))}catch(e){}}inp.value='';return out}
async function store(ps){const r=[];for(const p of ps){try{await fput(p.id,{name:p.name,type:p.type,data:p.data});r.push({id:p.id,name:p.name,type:p.type})}catch(e){}}return r}
async function addFiles(inp){pend.push(...await readAll(inp));drawPend()}
function drawPend(){const b=$('#pend');if(b)b.innerHTML=pend.map((p,i)=>`<div class="th">${p.type==='image'?`<img src="${p.data}" alt="">`:'PDF'}<b onclick="pend.splice(${i},1);drawPend()">×</b></div>`).join('')}
const bt=e=>{const n=(e.files||[]).length;return n?(e.note?' · ':'')+n+(n>1?' bills':' bill'):''};
let S={shoots:[]},cur=null,cat='Fuel';
try{S=JSON.parse(localStorage.getItem(K))||S}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>'₹'+Number(n).toLocaleString('en-IN',{maximumFractionDigits:2});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const dfmt=d=>new Date(d+'T00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
const spent=s=>s.entries.filter(e=>e.type==='spent').reduce((a,e)=>a+e.amt,0);
const got=s=>s.entries.filter(e=>e.type==='got').reduce((a,e)=>a+e.amt,0);
const bal=s=>spent(s)-got(s);
const find=id=>S.shoots.find(s=>s.id===id);

function sheet(h){$('#sheet').innerHTML='<div class="bg" onclick="closeS()"></div><div class="box">'+h+'</div>';$('#sheet').className='on'}
function closeS(){$('#sheet').className=''}

function home(){
  cur=null;
  const ts=S.shoots.reduce((a,s)=>a+spent(s),0),tg=S.shoots.reduce((a,s)=>a+got(s),0),owed=ts-tg;
  const list=[...S.shoots].sort((a,b)=>b.date.localeCompare(a.date)).map(s=>{
    const b=bal(s);
    return `<div class="card" onclick="openShoot('${s.id}')"><div><div class="t">${esc(s.name)}</div><div class="s">${esc(s.client?s.client+', ':'')}${dfmt(s.date)}</div></div><div class="amt ${b>0?'red':'green'}">${fmt(Math.abs(b))}<small>${b>0?'to claim':b<0?'extra received':'settled'}</small></div></div>`}).join('');
  $('#app').innerHTML=`<h1 style="margin-bottom:0">ShootBook</h1><button class="back" style="margin-bottom:12px" onclick="setName()">Name on PDF: ${esc(who())} · change</button>
  <div class="slate"><div class="stripes"></div><div class="in"><small>Company owes you</small><div class="big">${fmt(owed)}</div>
  <div class="row2"><div><small>You spent</small><b>${fmt(ts)}</b></div><div><small>You received</small><b>${fmt(tg)}</b></div></div></div></div>
  ${S.shoots.length?'<div class="two" style="margin-bottom:14px"><button class="btn b-ghost" onclick="summary(true)">Summary</button><button class="btn b-ghost" onclick="pdf(true)">PDF sheet</button></div>':''}${list||'<div class="empty">No shoots yet. Add your first shoot, then log what you spend on it.</div>'}
  <div class="fab"><button class="btn b-ink" onclick="newShoot()">Add shoot</button></div>`;
}

function newShoot(){
  sheet(`<h1>New shoot</h1><label>Shoot name</label><input id="n" placeholder="e.g. Fruitogen ad shoot"><label>Client or location (optional)</label><input id="c"><label>Date</label><input id="d" type="date" value="${today()}"><div class="gap"></div><button class="btn b-ink" onclick="saveShoot()">Save shoot</button>`);
  setTimeout(()=>$('#n').focus(),50);
}
function saveShoot(){
  const name=$('#n').value.trim();if(!name){$('#n').focus();return}
  const s={id:uid(),name,client:$('#c').value.trim(),date:$('#d').value||today(),entries:[]};
  S.shoots.push(s);save();closeS();openShoot(s.id);
}

function openShoot(id){
  cur=id;const s=find(id);if(!s)return home();
  const b=bal(s);
  const es=[...s.entries].sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
  let last='',html='';
  es.forEach(e=>{
    if(e.date!==last){html+=`<div class="day">${dfmt(e.date)}</div>`;last=e.date}
    html+=`<div class="card" onclick="entryMenu('${e.id}')"><div><div class="t">${e.type==='spent'?esc(e.cat):'Received from company'}</div><div class="s">${esc(e.note)}${bt(e)}</div></div><div class="amt ${e.type==='spent'?'red':'green'}">${e.type==='spent'?'−':'+'}${fmt(e.amt)}</div></div>`;
  });
  $('#app').innerHTML=`<div style="display:flex;justify-content:space-between"><button class="back" onclick="home()">‹ All shoots</button><button class="back" style="color:var(--red)" onclick="delShoot()">Delete shoot</button></div><h1>${esc(s.name)}</h1>
  <div class="slate"><div class="stripes"></div><div class="in"><small>${b>=0?'To claim from company':'Extra received'}</small><div class="big">${fmt(Math.abs(b))}</div>
  <div class="row2"><div><small>Spent</small><b>${fmt(spent(s))}</b></div><div><small>Received</small><b>${fmt(got(s))}</b></div></div></div></div>
  <div class="two" style="margin-bottom:6px"><button class="btn b-ghost" onclick="summary(false)">Summary</button><button class="btn b-ghost" onclick="pdf(false)">PDF sheet</button></div>
  ${html||'<div class="empty">No entries yet. Tap “I spent” when you pay for something on this shoot.</div>'}
  <div class="fab"><button class="btn b-red" onclick="entry('spent')">I spent</button><button class="btn b-green" onclick="entry('got')">I received</button></div>`;
}

function calc(s){
  s=String(s).replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/\s/g,'');
  const t=s.match(/\d+\.?\d*|\.\d+|[-+*/]/g);
  if(!t||t.join('')!==s)return NaN;
  if(t[0]==='-')t.unshift('0');
  const a=[+t[0]],o=[];
  if(isNaN(a[0]))return NaN;
  for(let i=1;i<t.length;i+=2){const op=t[i],n=+t[i+1];if(isNaN(n)||!'+-*/'.includes(op))return NaN;
    if(op==='*')a[a.length-1]*=n;else if(op==='/')a[a.length-1]/=n;else{o.push(op);a.push(n)}}
  let r=a[0];o.forEach((op,i)=>r=op==='+'?r+a[i+1]:r-a[i+1]);
  return isFinite(r)?Math.round(r*100)/100:NaN;
}
const KP='<div class="kp">'+['7','8','9','÷','4','5','6','×','1','2','3','−','0','.','⌫','+'].map(k=>`<button class="${'÷×−+'.includes(k)?'op':''}" onclick="key('${k}')">${k}</button>`).join('')+`<button class="w2" onclick="key('C')">Clear</button><button class="w2 op" onclick="key('=')">=</button></div>`;
function key(k){const a=$('#a');if(k==='C')a.value='';else if(k==='⌫')a.value=a.value.slice(0,-1);else if(k==='='){const r=calc(a.value);if(!isNaN(r))a.value=r}else a.value+=k;prev()}
function prev(){const v=$('#a').value,r=calc(v),p=$('#ap');if(p)p.textContent=v&&isNaN(+v)&&!isNaN(r)?'= '+fmt(r):''}
function entry(type,eid){
  const ed=eid?find(cur).entries.find(x=>x.id===eid):null;
  cat=ed?catOf(ed):'Food';pend=[];
  const chips=type==='spent'?`<label>Category</label><div class="chips">${CATS.map(c=>`<button class="chip${c===cat?' on':''}" onclick="pick(this,'${c}')">${c}</button>`).join('')}</div>`:'';
  sheet(`<h1 class="${type==='spent'?'red':'green'}">${ed?(type==='spent'?'Edit expense':'Edit payment'):type==='spent'?'I spent':'I received from company'}</h1>
  <label>Amount (₹): use the keypad to add, subtract, multiply or divide</label><input id="a" class="amtin" type="text" inputmode="none" autocomplete="off" placeholder="0" value="${ed?ed.amt:''}" oninput="prev()"><div id="ap"></div>${KP}${chips}
  <label>Note (optional)</label><input id="no" value="${ed?esc(ed.note):''}" placeholder="${type==='spent'?'e.g. Petrol for the drive to location':'e.g. Bank transfer'}">
  <label>Date</label><input id="d" type="date" value="${ed?ed.date:today()}">${type==='spent'?`<label>Bill (photo or PDF)</label><div id="pend" class="thumbs"></div><input id="fi" type="file" accept="image/*,application/pdf" multiple hidden onchange="addFiles(this)"><div style="height:8px"></div><button class="btn b-ghost" onclick="$('#fi').click()">Add photo or PDF</button>`:''}<div class="gap"></div>
  <button class="btn ${type==='spent'?'b-red':'b-green'}" onclick="saveEntry('${type}','${eid||''}')">Save</button>`);
  setTimeout(()=>$('#a').focus(),50);
}
function pick(el,c){cat=c;document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));el.classList.add('on')}
async function saveEntry(type,eid){
  const amt=calc($('#a').value);if(!(amt>0)){$('#a').focus();return}
  const files=await store(pend);
  const s=find(cur),ed=eid&&s.entries.find(x=>x.id===eid),v={amt,cat:type==='spent'?cat:'',note:$('#no').value.trim(),date:$('#d').value||today()};
  if(ed){Object.assign(ed,v);ed.files=(ed.files||[]).concat(files)}else s.entries.push({id:uid(),type,files,...v});
  pend=[];save();closeS();openShoot(cur);
}
async function entryMenu(id){
  const e=find(cur).entries.find(x=>x.id===id),fl=e.files||[];
  const th=(await Promise.all(fl.map(async f=>{const r=await fget(f.id).catch(()=>null);return r?`<div class="th" onclick="openFile('${f.id}','${id}')">${r.type==='image'?`<img src="${r.data}" alt="">`:'PDF'}</div>`:''}))).join('');
  sheet(`<h1>${e.type==='spent'?esc(e.cat):'Received'}: ${fmt(e.amt)}</h1><div style="color:var(--mut)">${dfmt(e.date)}${e.note?' · '+esc(e.note):''}</div>${th?`<label>Bills (tap to open)</label><div class="thumbs">${th}</div>`:''}<div class="gap"></div>${e.type==='spent'?`<input id="fi" type="file" accept="image/*,application/pdf" multiple hidden onchange="addMore(this,'${id}')"><button class="btn b-ghost" onclick="$('#fi').click()">Add photo or PDF</button><div class="gap"></div>`:''}<button class="btn b-ink" onclick="entry('${e.type}','${id}')">Edit entry</button><div class="gap"></div><button class="btn b-del" onclick="delEntry('${id}')">Delete entry</button><div class="gap"></div><button class="btn b-ghost" onclick="closeS()">Close</button>`);
}
async function addMore(inp,id){const e=find(cur).entries.find(x=>x.id===id);e.files=(e.files||[]).concat(await store(await readAll(inp)));save();openShoot(cur);entryMenu(id)}
async function openFile(fid,id){
  const r=await fget(fid).catch(()=>null);if(!r)return;
  if(r.type==='image'){sheet(`<img src="${r.data}" alt="Bill" style="width:100%;border-radius:10px"><div class="two" style="margin-top:12px"><button class="btn b-ghost" onclick="entryMenu('${id}')">Back</button><button class="btn b-del" onclick="delBill('${fid}','${id}')">Delete bill</button></div>`);return}
  try{const dl=await getDl();await dl.save({filename:/\.pdf$/i.test(r.name)?r.name:r.name+'.pdf',data:blobOf(r.data)})}catch(e){}
}
function delBill(fid,id){const e=find(cur).entries.find(x=>x.id===id);e.files=e.files.filter(f=>f.id!==fid);fdel(fid);save();openShoot(cur);entryMenu(id)}
function delEntry(id){const s=find(cur),e=s.entries.find(x=>x.id===id);(e.files||[]).forEach(f=>fdel(f.id));s.entries=s.entries.filter(x=>x.id!==id);save();closeS();openShoot(cur)}
function delShootGo(){find(cur).entries.forEach(e=>(e.files||[]).forEach(f=>fdel(f.id)));S.shoots=S.shoots.filter(x=>x.id!==cur);save();closeS();home()}
function delShoot(){sheet(`<h1>Delete this shoot?</h1><div style="color:var(--mut)">All its entries will be removed. This can’t be undone.</div><div class="gap"></div><button class="btn b-del" onclick="delShootGo()">Delete shoot</button><div class="gap"></div><button class="btn b-ghost" onclick="closeS()">Cancel</button>`)}

const catOf=e=>CATS.includes(e.cat)?e.cat:'Other';
function totals(ss){const t={};CATS.forEach(c=>t[c]=0);ss.forEach(s=>s.entries.forEach(e=>{if(e.type==='spent')t[catOf(e)]+=e.amt}));return t}
function sumText(ss,title){
  const t=totals(ss),sp=ss.reduce((a,s)=>a+spent(s),0),gt=ss.reduce((a,s)=>a+got(s),0);
  let x=`*${title}*\n`;
  if(ss.length===1)x+=dfmt(ss[0].date)+(ss[0].client?', '+ss[0].client:'')+'\n';
  x+='\n';
  CATS.forEach(c=>{if(t[c]>0)x+=`${c}: ${fmt(t[c])}\n`});
  if(!sp)x+='No expenses yet\n';
  x+=`\n*Total spent: ${fmt(sp)}*\n`;
  if(gt>0)x+=`Received: ${fmt(gt)}\n`;
  x+=`*Balance to claim: ${fmt(sp-gt)}*`;
  if(ss.length>1)x+='\n\nBy shoot:\n'+ss.map(s=>`${s.name}: ${fmt(bal(s))}`).join('\n');
  return x;
}
function summary(all){
  const ss=all?S.shoots:[find(cur)];
  sheet(`<h1>Summary</h1><textarea id="ct" class="claim" readonly>${esc(sumText(ss,all?'Expense summary: all shoots':'Expense summary: '+ss[0].name))}</textarea><div class="gap"></div><div class="two"><button id="cb" class="btn b-ink" onclick="copyC()">Copy for WhatsApp</button><button class="btn b-ghost" onclick="shareC()">Share</button></div>`);
}
async function shareC(){
  const t=$('#ct').value;
  try{if(navigator.share){await navigator.share({text:t});return}}catch(e){if(e&&e.name==='AbortError')return}
  copyC();
}
async function copyC(){
  const ta=$('#ct'),b=$('#cb');ta.focus();ta.select();ta.setSelectionRange(0,99999);let ok=false;
  try{await navigator.clipboard.writeText(ta.value);ok=true}catch(e){try{ok=document.execCommand('copy')}catch(_){}}
  if(b)b.textContent=ok?'Copied ✓':'Touch and hold the text to copy';
}
const who=()=>S.name||'Nishad';
function setName(){sheet(`<h1>Name on PDF</h1><label>Your name</label><input id="nm" value="${esc(who())}"><div class="gap"></div><button class="btn b-ink" onclick="saveName()">Save name</button>`)}
function saveName(){S.name=$('#nm').value.trim();save();closeS();home()}
async function getDl(){let c=null;try{c=window.claude?await window.claude.use('downloads'):null}catch(e){}
  return c||{save:async({filename,data})=>{const u=URL.createObjectURL(data),a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}}}
function note(m){sheet(`<h1>PDF sheet</h1><div style="color:var(--mut)">${m}</div><div class="gap"></div><button class="btn b-ghost" onclick="closeS()">OK</button>`)}
async function pdf(all){
  const ss=all?S.shoots:[find(cur)];
  if(!window.jspdf)return note('The PDF tool could not load. Check your internet connection and try again.');
  const dl=await getDl();
  const d=new window.jspdf.jsPDF({unit:'mm',format:'a4'}),W=210,M=14;let y=0;
  const T=s=>String(s==null?'':s).replace(/[^\x20-\xFF]/g,'');
  const R=n=>'Rs '+Number(n).toLocaleString('en-IN',{maximumFractionDigits:2});
  const need=h=>{if(y+h>280){d.addPage();y=16}};
  const hdr=()=>{d.setFillColor(235,238,241);d.rect(M,y,W-2*M,7,'F');d.setFont('helvetica','bold');d.setFontSize(8.5);d.setTextColor(60);d.text('Date',M+2,y+4.8);d.text('Category',M+30,y+4.8);d.text('Note',M+55,y+4.8);d.text('Spent',W-M-32,y+4.8,{align:'right'});d.text('Received',W-M-2,y+4.8,{align:'right'});y+=7};
  const col=b=>b>0?[190,40,35]:[23,128,61];
  d.setFillColor(18,22,28);d.rect(0,0,W,26,'F');d.setTextColor(255);d.setFont('helvetica','bold');d.setFontSize(17);d.text('Expense Balance Sheet',M,13);
  d.setFont('helvetica','normal');d.setFontSize(9);d.text('Generated '+new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}),M,20);d.text('Prepared by '+T(who()),W-M,20,{align:'right'});
  d.setFillColor(18,22,28);for(let i=0;i<W;i+=8)d.rect(i,26,4,3,'F');
  y=38;
  for(const s of ss){
    need(50);
    d.setFont('helvetica','bold');d.setFontSize(13);d.setTextColor(20);d.text(T(s.name),M,y);y+=5.5;
    d.setFont('helvetica','normal');d.setFontSize(9);d.setTextColor(110);d.text(T((s.client?s.client+', ':'')+dfmt(s.date)),M,y);y+=5;
    hdr();
    for(const e of [...s.entries].sort((a,b)=>a.date.localeCompare(b.date))){
      if(y+7>280){d.addPage();y=16;hdr()}
      d.setFont('helvetica','normal');d.setFontSize(8.5);d.setTextColor(30);
      d.text(dfmt(e.date),M+2,y+4.6);d.text(e.type==='spent'?T(e.cat):'Received',M+30,y+4.6);
      d.text(d.splitTextToSize(T(e.note)+(e.files&&e.files.length?' [bill]':''),58)[0]||'',M+55,y+4.6);
      if(e.type==='spent'){d.setTextColor(190,40,35);d.text(R(e.amt),W-M-32,y+4.6,{align:'right'})}else{d.setTextColor(23,128,61);d.text(R(e.amt),W-M-2,y+4.6,{align:'right'})}
      d.setDrawColor(225);d.line(M,y+7,W-M,y+7);y+=7;
    }
    need(26);y+=2;
    d.setFont('helvetica','bold');d.setFontSize(9);d.setTextColor(30);d.text('Total',M+2,y+4.6);d.text(R(spent(s)),W-M-32,y+4.6,{align:'right'});d.text(R(got(s)),W-M-2,y+4.6,{align:'right'});y+=9;
    const b=bal(s);d.setFontSize(11);d.setTextColor(...col(b));d.text((b>=0?'Balance to claim: ':'Extra received: ')+R(Math.abs(b)),W-M-2,y,{align:'right'});y+=6;
    const t=totals([s]),line=CATS.filter(c=>t[c]>0).map(c=>c+' '+R(t[c])).join('    ');
    if(line){d.setFont('helvetica','normal');d.setFontSize(8.5);d.setTextColor(110);d.text(d.splitTextToSize(line,W-2*M),M,y);y+=5}
    y+=8;
  }
  if(ss.length>1){
    need(30);const sp=ss.reduce((a,s)=>a+spent(s),0),gt=ss.reduce((a,s)=>a+got(s),0);
    d.setFillColor(18,22,28);d.rect(M,y,W-2*M,22,'F');d.setTextColor(255);d.setFont('helvetica','normal');d.setFontSize(9);
    d.text('Total spent: '+R(sp),M+4,y+8);d.text('Total received: '+R(gt),M+4,y+15);
    d.setFont('helvetica','bold');d.setFontSize(13);d.text('Balance to claim: '+R(sp-gt),W-M-4,y+13,{align:'right'});y+=30;
  }
  const pn=[];ss.forEach(s=>s.entries.forEach(e=>(e.files||[]).forEach(f=>{if(f.type!=='image')pn.push(T(f.name))})));
  if(pn.length){need(14);d.setFont('helvetica','normal');d.setFontSize(8.5);d.setTextColor(110);d.text(d.splitTextToSize('PDF bills (kept in the app, not shown here): '+pn.join(', '),W-2*M),M,y)}
  for(const s of ss)for(const e of s.entries)for(const f of e.files||[]){
    const r=await fget(f.id).catch(()=>null);if(!r||r.type!=='image')continue;
    d.addPage();d.setFont('helvetica','bold');d.setFontSize(10);d.setTextColor(30);
    d.text(T(`Bill: ${s.name}, ${e.cat||''} ${R(e.amt)}, ${dfmt(e.date)}`),M,16);
    try{const p=d.getImageProperties(r.data),k=Math.min((W-2*M)/p.width,255/p.height);d.addImage(r.data,'JPEG',M,22,p.width*k,p.height*k)}catch(_){}
  }
  const n=d.getNumberOfPages();
  for(let i=1;i<=n;i++){d.setPage(i);d.setFont('helvetica','normal');d.setFontSize(8);d.setTextColor(140);d.text(`Page ${i} of ${n}`,W/2,291,{align:'center'})}
  try{await dl.save({filename:'ShootBook-'+(all?'all-shoots':T(ss[0].name).replace(/[^\w]+/g,'-'))+'.pdf',data:d.output('blob')})}catch(e){if(!e||e.code!=='declined')note('The PDF could not be saved. Try again.')}
}
home();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
